# Order must not matter (CLAUDE.md, "Every test is isolated"). Surefire's <runOrder>random</runOrder>
# shuffles test CLASSES; it says nothing about the methods inside one, which JUnit otherwise runs in
# a deterministic order. Method-level order-dependence is the commoner kind — one method leaving
# state the next one reads — so shuffle there too, or half the rule is unenforced.
#
# A shuffled order is only usable because it is REPRODUCIBLE. Every run logs
#   "CONFIG: MethodOrderer.Random default seed: <n>"
# and re-running with -Djunit.jupiter.execution.order.random.seed=<n> gives that order back, exactly
# as -Dsurefire.runOrder.random.seed=<n> does for the class order. Note the level: JUnit prints that
# line at CONFIG, which nothing else in this build shows, so src/test/resources/logging.properties
# exists purely to let it through. Without it the shuffle is silent and a failing order cannot be
# recovered, which is worse than not shuffling — the failure reads as flake and gets re-run until
# green. The two files ship together.
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$Random
