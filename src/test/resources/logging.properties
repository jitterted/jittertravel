# java.util.logging config for the test JVM, pointed at by surefire's argLine
# (-Djava.util.logging.config.file). It exists for exactly one line of output.
#
# Methods are shuffled (junit-platform.properties), and a shuffled order is only usable if it is
# REPRODUCIBLE. JUnit does print the seed it picked —
#   "CONFIG: MethodOrderer.Random default seed: <n>"
# — but it prints it at CONFIG level, and nothing else in this build logs below INFO, so with the
# stock JUL setup it goes nowhere and the order of a failing run cannot be recovered. Re-run with
# -Djunit.jupiter.execution.order.random.seed=<n> to get that order back, exactly as
# -Dsurefire.runOrder.random.seed=<n> does for the class order.
#
# Deliberately narrow: only the org.junit logger drops to CONFIG. The root level stays at INFO, so
# every other library keeps the level it had; the handler has to be lowered too, since a handler
# filters the records its logger lets through. Spring Boot replaces the JUL handlers with the
# SLF4J bridge when a context starts, which is fine — the seed is logged once, at class-loading
# time, long before that.
handlers=java.util.logging.ConsoleHandler
.level=INFO
java.util.logging.ConsoleHandler.level=CONFIG
org.junit.level=CONFIG
