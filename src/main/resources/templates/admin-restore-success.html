<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Restore Complete — Admin — JitterTravel</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #faf9f7;
            --surface: #ffffff;
            --text-primary: #1a1916;
            --text-secondary: #6b6860;
            --text-muted: #b0aea8;
            --border: rgba(0, 0, 0, 0.10);
            --success: #1a7a3f;
            --success-bg: #f0faf4;
            --success-border: #b2dfc4;
            --warning: #9a6b00;
            --warning-text: #6e4d00;
            --warning-bg: #fdf3d8;
            --warning-border: #e6c66b;
            --radius: 10px;
        }

        body {
            font-family: ui-sans-serif, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            border-radius: var(--radius);
            padding: 2.5rem 3rem;
            text-align: center;
            max-width: 44ch;
        }

        .checkmark {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .restart-warning {
            display: flex;
            align-items: flex-start;
            gap: 0.7rem;
            text-align: left;
            font-size: 0.95rem;
            color: var(--warning-text);
            background: var(--warning-bg);
            border: 1px solid var(--warning-border);
            border-radius: 6px;
            padding: 0.85rem 1.05rem;
        }

        .restart-warning .icon {
            flex: 0 0 auto;
            font-size: 1.3rem;
            line-height: 1.3;
            color: var(--warning);
        }

        .restart-warning p {
            margin: 0;
            color: var(--warning-text);
        }

        .restart-warning strong {
            font-weight: 700;
            color: var(--warning-text);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="checkmark">✓</div>
    <h1>Restore complete</h1>
    <p th:text="'Restored ' + ${restoredCommands} + ' command(s) and ' + ${restoredEvents} + ' event(s).'"></p>
    <p th:if="${skippedCommands > 0 or skippedEvents > 0}"
       th:text="'Skipped ' + ${skippedCommands} + ' command(s) and ' + ${skippedEvents} + ' event(s) already present.'"></p>
    <div class="restart-warning">
        <span class="icon" aria-hidden="true">⚠</span>
        <p>
            <strong>Restart the application</strong> to rebuild the read models — the boot replay
            folds the restored events into fresh projectors. Until then, pages still show the
            pre-restore data.
        </p>
    </div>
</div>

</body>
</html>
