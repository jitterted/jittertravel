<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Backup / Restore</title>
    <link rel="stylesheet" href="/site.css"/>
    <style>
        .restore-container {
            max-width: 90ch;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        textarea {
            width: 100%;
            font-family: monospace;
            font-size: 0.85rem;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--header-bg);
            color: var(--text-color);
            resize: vertical;
            box-sizing: border-box;
        }

        .error-list {
            background: #fff3f3;
            border: 1px solid #f88;
            border-radius: 6px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
        }

        .error-list li {
            font-family: monospace;
            font-size: 0.85rem;
            color: #c00;
        }

        .validated-note {
            background: #f0fff4;
            border: 1px solid #8c8;
            border-radius: 6px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            color: #060;
        }
    </style>
</head>
<body>
<div class="restore-container">
    <h1>Backup / Restore</h1>

    <div th:if="${errors != null and not #lists.isEmpty(errors)}">
        <ul class="error-list">
            <li th:each="error : ${errors}" th:text="${error}"></li>
        </ul>
    </div>

    <div th:if="${validatedCommands != null}" class="validated-note">
        <span th:text="'Validated: ' + ${validatedCommands} + ' command(s) and ' + ${validatedEvents} + ' event(s) would restore. Nothing was written.'"></span>
    </div>

    <form method="post" th:action="@{/admin/restore}">
        <div class="toolbar">
            <label for="fileInput">Load from file:</label>
            <input type="file" id="fileInput" accept=".json"/>
            <button type="submit" th:formaction="@{/admin/restore/validate}">Validate only</button>
            <button type="submit">Restore</button>
            <a href="/admin/backup">Backup (download)</a>
            <a href="/admin">Admin</a>
        </div>
        <textarea id="content" name="content" rows="35"
                  placeholder="Paste backup JSON here, or load a file above..."
                  th:text="${content}"></textarea>
    </form>
</div>
<script>
    document.getElementById('fileInput').addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
            document.getElementById('content').value = e.target.result;
        };
        reader.readAsText(file);
    });
</script>
</body>
</html>
